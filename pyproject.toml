[project]
name = "mechinterp"
version = "0.1.0"
description = "Small JAX/Penzai experiments in mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax>=0.4.35,<0.7",
  "penzai==0.2.5",
  "transformers>=4.44,<4.52",
  "torch>=2.2,<3",
  "fonttools<4.69.0",
  "matplotlib>=3.11.2",
  "datasets>=5.0.1",
  "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechinterp"]

[tool.pytest.ini_options]
markers = ["integration: downloads a pretrained model; run explicitly"]

[tool.ruff]
line-length = 88
